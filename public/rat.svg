<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2d78"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <!-- body -->
  <ellipse cx="32" cy="38" rx="18" ry="14" fill="url(#g)"/>
  <!-- head -->
  <circle cx="32" cy="22" r="12" fill="url(#g)"/>
  <!-- left ear -->
  <ellipse cx="22" cy="12" rx="7" ry="8" fill="#ff2d78"/>
  <ellipse cx="22" cy="12" rx="4.5" ry="5.5" fill="#1a1a2e"/>
  <!-- right ear -->
  <ellipse cx="42" cy="12" rx="7" ry="8" fill="#ff2d78"/>
  <ellipse cx="42" cy="12" rx="4.5" ry="5.5" fill="#1a1a2e"/>
  <!-- eyes -->
  <circle cx="27" cy="20" r="2.5" fill="#fff"/>
  <circle cx="37" cy="20" r="2.5" fill="#fff"/>
  <circle cx="27.8" cy="19.5" r="1.2" fill="#1a1a2e"/>
  <circle cx="37.8" cy="19.5" r="1.2" fill="#1a1a2e"/>
  <!-- nose -->
  <ellipse cx="32" cy="26" rx="2" ry="1.5" fill="#1a1a2e"/>
  <!-- whiskers -->
  <line x1="18" y1="24" x2="28" y2="25" stroke="#fff" stroke-width="0.8" opacity="0.6"/>
  <line x1="18" y1="27" x2="28" y2="26" stroke="#fff" stroke-width="0.8" opacity="0.6"/>
  <line x1="46" y1="24" x2="36" y2="25" stroke="#fff" stroke-width="0.8" opacity="0.6"/>
  <line x1="46" y1="27" x2="36" y2="26" stroke="#fff" stroke-width="0.8" opacity="0.6"/>
  <!-- tail -->
  <path d="M50 38 Q58 30 54 20 Q52 14 56 10" fill="none" stroke="#ff2d78" stroke-width="2.5" stroke-linecap="round"/>
